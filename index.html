<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartita para mi lore</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom, #ffe6f0, #fff);
      overflow-x: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #fff0f5;
      border-radius: 20px;
      padding: 30px;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }
    h1 { color: #e60073; margin-bottom: 20px; }
    p { font-size: 1.1em; color: #333; }
    .snoopy-img {
      max-width: 100%;
      border-radius: 15px;
      margin: 20px 0;
    }
    button {
      background-color: #ff66a3;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      font-size: 1em;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #ff3385;
    }
    .floating-hearts {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 999;
    }
    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      transform: rotate(45deg);
      animation: float 4s linear infinite;
    }
    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      border-radius: 50%;
    }
    .heart::before { top: -10px; left: 0; }
    .heart::after { top: 0; left: -10px; }
    @keyframes float {
      0% { transform: translateY(0) rotate(45deg); opacity: 1; }
      100% { transform: translateY(-100vh) rotate(45deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Hola mi loreeee</h1>
      <p>
        Qué hermosa te ves el día de hoy, mi vida. Nunca olvides lo mucho que te quiero, y haré todo lo posible para que me elijas
        y te des cuenta de que quiero todo contigo. Te quieroooooooo.
      </p>
      <img class="snoopy-img" src="lore.jpeg" alt="Snoopy enamorado">
      <button onclick="mostrarFrase()">Toca aquí para ver algo lindo</button>
      <p id="frase"></p>
      <audio controls autoplay loop>
        <source src="Virlán García - MMXXs [Official Video].mp3" type="audio/mp3">
        Tu navegador no soporta la reproducción de audio.
      </audio>
    </div>
  </div>
  <div class="floating-hearts" id="hearts"></div>  <script>
    const frases = [
      'Eres mi persona favorita en el mundo entero.',
      'Cada día contigo es un regalo hermoso.',
      'Si pudiera darte una cosa en la vida, te daría la capacidad de verte a través de mis ojos.',
      'Tú y yo somos el mejor equipo del universo.',
      'No hay nadie más con quien prefiera ver atardeceres.'
    ];

    function mostrarFrase() {
      const frase = frases[Math.floor(Math.random() * frases.length)];
      document.getElementById('frase').innerText = frase;
      crearCorazones();
    }

    function crearCorazones() {
      for (let i = 0; i < 20; i++) {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.top = Math.random() * 100 + 'vh';
        heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
        document.getElementById('hearts').appendChild(heart);
        setTimeout(() => heart.remove(), 4000);
      }
    }
  </script></body>
</html>
